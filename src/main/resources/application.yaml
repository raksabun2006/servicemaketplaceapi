server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:serviceplatform}}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:${DB_USERNAME:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${DB_PASSWORD:postgres}}}
    driver-class-name: org.postgresql.Driver

  data:
    web:
      pageable:
        serialization-mode: via-dto

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${FILE_MAX_SIZE:15MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:30MB}

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
    issuer: ${JWT_ISSUER:service-platform}
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:15}
    request-cooldown-seconds: ${PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:60}
    cleanup-cron: ${PASSWORD_RESET_CLEANUP_CRON:0 0 * * * *}
    cleanup:
      enabled: ${PASSWORD_RESET_CLEANUP_ENABLED:true}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

app:
  frontend-url: ${FRONTEND_URL:https://servicemaketplacefront.vercel.app}
  password-reset:
    path: ${PASSWORD_RESET_PATH:/reset-password}
  mail:
    from: ${MAIL_FROM:Khmer Service <onboarding@resend.dev>}
    provider: ${MAIL_PROVIDER:auto}
    resend:
      api-key: ${RESEND_API_KEY:}
      api-url: ${RESEND_API_URL:https://api.resend.com/emails}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://servicemaketplacefront.vercel.app,https://*.vercel.app,http://localhost:3000,http://localhost:5173,http://localhost:[*],http://127.0.0.1:[*]}
  file:
    storage:
      type: ${FILE_STORAGE_TYPE:local}
      base-path: ${FILE_STORAGE_PATH:/uploads}
