spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:serviceplatform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    web:
      pageable:
        serialization-mode: via-dto

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: ${FILE_MAX_SIZE:15MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:30MB}

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
    issuer: ${JWT_ISSUER:service-platform}

app:
  file:
    storage:
      type: ${FILE_STORAGE_TYPE:local}
      base-path: ${FILE_STORAGE_PATH:/uploads}
